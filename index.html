<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WorldBuilder LOD0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10242b;color:#eee;font-family:system-ui,sans-serif}#app{position:fixed;inset:0;display:grid;grid-template-rows:43% 57%;gap:2px;background:#395057}.panel{position:relative;overflow:hidden;background:#173038}.bar{position:absolute;z-index:5;left:10px;top:10px;background:#071116dd;border-radius:7px;padding:6px 10px;font-size:13px}.tools{position:absolute;z-index:6;right:8px;top:8px;display:flex;gap:5px}.tools button,.menu button{border:1px solid #809297;background:#263d44;color:#eee;border-radius:6px;padding:7px 10px}.tools button.on{background:#e4cb70;color:#211d0e}.meta{position:absolute;z-index:7;left:10px;right:10px;bottom:10px;padding:8px 10px;background:#071116e8;border-radius:7px;color:#9edfff;font-size:12px;line-height:1.4}.menu{position:fixed;display:none;z-index:50;width:min(280px,calc(100vw - 12px));padding:10px;background:#0b181d;border:1px solid #809297;border-radius:8px;box-shadow:0 8px 28px #000a}.menu.open{display:block}.menu .title{color:#9edfff;font-size:12px;margin-bottom:8px}.menu label{display:block;color:#9edfff;font-size:11px;margin:6px 0 3px}.menu input,.menu select{width:100%;border:1px solid #809297;background:#20363d;color:#eee;border-radius:5px;padding:7px}.menu button{width:100%;margin-top:7px}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-touch-callout:none;user-select:none}#globe{position:absolute;inset:0;touch-action:none;-webkit-touch-callout:none;user-select:none}#globe canvas{width:100%!important;height:100%!important}
</style></head><body>
<div id="app"><section class="panel"><div class="bar">LOD 0 · MAP · drag paints</div><div class="tools"><button id="add" class="on">ADD</button><button id="erase">ERASE</button><button id="invert">INVERT</button><button id="clear">CLEAR</button><button id="export">JSON</button></div><canvas id="map"></canvas><div class="meta" id="meta">METADATA: NULL</div></section><section class="panel"><div class="bar">LOD 0 · GLOBE</div><div id="globe"></div></section></div>
<div class="menu" id="menu"><div class="title" id="menuTitle"></div><div id="editPane"><label>NAME</label><input id="name" placeholder="NULL"><label>METADATA RESOLUTION</label><select id="resolution"><option>GLOBAL</option><option>CONTINENTAL</option><option>NATIONAL</option><option>REGIONAL</option><option>COUNTY</option><option>VILLAGE</option><option>DISTRICT</option><option>NEIGHBORHOOD</option></select><label>METADATA</label><input id="data" placeholder="NULL"><button id="done">DONE</button><button id="editInvert">INVERT SELECTION</button><button id="editCancel">CANCEL</button></div><div id="addPane"><button id="menuAdd">ADD</button><button id="menuInvert">INVERT SELECTION</button><button id="addCancel">CANCEL</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
const KEY='worldbuilder.world.v1',LONG=520,DRAG=16,DOUBLE=340,DOUBLE_DIST=30,COUNT=20;
const map=document.querySelector('#map'),meta=document.querySelector('#meta'),menu=document.querySelector('#menu'),menuTitle=document.querySelector('#menuTitle'),editPane=document.querySelector('#editPane'),addPane=document.querySelector('#addPane'),nameInput=document.querySelector('#name'),resolution=document.querySelector('#resolution'),dataInput=document.querySelector('#data');
const fresh=()=>({version:1,lod:0,selected:[],inspection:null,areas:[]});let world=load(),mode='add',contextFace=-1,contextArea=null,contextOriginal=null,targetQ=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.version===1?x:fresh()}catch{return fresh()}}
function saveWorld(){localStorage.setItem(KEY,JSON.stringify(world))}
const selected=id=>world.selected.includes(id);
function recenterSelection(){if(!world.selected.length){targetQ=null;return}const m=new THREE.Vector3();for(const id of world.selected){const t=faces[id];if(!t)continue;m.add(t[0]).add(t[1]).add(t[2])}if(m.lengthSq()<1e-9)return;m.normalize();const q=group.quaternion.clone(),worldMean=m.clone().applyQuaternion(q),fix=new THREE.Quaternion().setFromUnitVectors(worldMean,new THREE.Vector3(0,0,1));targetQ=fix.multiply(q)}
function selectionChanged(){saveWorld();renderAll();recenterSelection()}
function setSelected(id,on){const s=new Set(world.selected);on?s.add(id):s.delete(id);world.selected=[...s].sort((a,b)=>a-b);selectionChanged()}
function toggleSelected(id){setSelected(id,!selected(id))}
function clearSelection(){world.selected=[];selectionChanged()}
function invert(){world.selected=Array.from({length:COUNT},(_,i)=>i).filter(i=>!selected(i));saveWorld();closeMenu(true);renderAll();recenterSelection()}
function selectionKey(ids=world.selected){return [...ids].sort((a,b)=>a-b).join(',')}
function areaForSelection(){const k=selectionKey();return world.areas.find(a=>selectionKey(a.triangles)===k)||null}
function inspect(id){world.inspection=id;saveWorld();renderAll()}
for(const id of ['add','erase'])document.querySelector('#'+id).onclick=()=>{mode=id;document.querySelector('#add').classList.toggle('on',id==='add');document.querySelector('#erase').classList.toggle('on',id==='erase')};document.querySelector('#invert').onclick=invert;document.querySelector('#clear').onclick=clearSelection;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x10242b);const camera=new THREE.PerspectiveCamera(38,1,.1,20);camera.position.z=3.2;const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.querySelector('#globe').appendChild(renderer.domElement);const group=new THREE.Group();group.rotation.order='YXZ';scene.add(group);scene.add(new THREE.HemisphereLight(0xffffff,0x26363b,1.8));const dl=new THREE.DirectionalLight(0xffffff,1.8);dl.position.set(3,3,5);scene.add(dl);const geometry=new THREE.IcosahedronGeometry(1,0).toNonIndexed(),p=geometry.attributes.position,colors=new Float32Array(p.count*3);geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));const mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.82,side:THREE.FrontSide}));const wire=new THREE.LineSegments(new THREE.EdgesGeometry(geometry),new THREE.LineBasicMaterial({color:0x41575b,depthTest:true}));group.add(mesh,wire);const faces=[];for(let i=0;i<p.count;i+=3)faces.push([new THREE.Vector3().fromBufferAttribute(p,i),new THREE.Vector3().fromBufferAttribute(p,i+1),new THREE.Vector3().fromBufferAttribute(p,i+2)]);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function uv(v){const n=v.clone().normalize();return{u:(Math.atan2(n.z,n.x)+Math.PI)/(2*Math.PI),v:.5-Math.asin(n.y)/Math.PI}}
function copies(t){const q=t.map(uv),us=q.map(x=>x.u);if(Math.max(...us)-Math.min(...us)<=.5)return[q];return[q.map(x=>({u:x.u<.5?x.u+1:x.u,v:x.v})),q.map(x=>({u:x.u>.5?x.u-1:x.u,v:x.v}))]}
function inside(x,y,a,b,c){const s=(p1,p2,p3)=>(p1.x-p3.x)*(p2.y-p3.y)-(p2.x-p3.x)*(p1.y-p3.y),q={x,y},a1=s(q,a,b),a2=s(q,b,c),a3=s(q,c,a);return!((a1<0||a2<0||a3<0)&&(a1>0||a2>0||a3>0))}
function mapFace(x,y){const r=map.getBoundingClientRect(),u=(x-r.left)/r.width,v=(y-r.top)/r.height;for(let i=0;i<COUNT;i++)for(const q of copies(faces[i]))if(inside(u,v,{x:q[0].u,y:q[0].v},{x:q[1].u,y:q[1].v},{x:q[2].u,y:q[2].v}))return i;return-1}
function globeFace(x,y){const r=renderer.domElement.getBoundingClientRect();mouse.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height*2-1));ray.setFromCamera(mouse,camera);const hit=ray.intersectObject(mesh,false)[0];return hit?hit.faceIndex:-1}
function faceColor(i){if(selected(i))return'#e4cb70';if(i===world.inspection)return'#9edfff';return'#ae9d7d'}
function faceRGB(i){if(selected(i))return[.89,.79,.43];if(i===world.inspection)return[.38,.78,1];return[.70,.63,.49]}
function drawMap(){const c=map.getContext('2d'),w=map.width,h=map.height;c.fillStyle='#284851';c.fillRect(0,0,w,h);for(let i=0;i<COUNT;i++)for(const q of copies(faces[i])){c.beginPath();c.moveTo(q[0].u*w,q[0].v*h);c.lineTo(q[1].u*w,q[1].v*h);c.lineTo(q[2].u*w,q[2].v*h);c.closePath();c.fillStyle=faceColor(i);c.fill();c.strokeStyle='#405458';c.stroke()}}
function renderAll(){const col=geometry.attributes.color;for(let i=0;i<COUNT;i++){const rgb=faceRGB(i);for(let k=0;k<3;k++)col.setXYZ(i*3+k,...rgb)}col.needsUpdate=true;drawMap();const id=world.inspection;if(id==null){meta.textContent='METADATA: NULL';return}const hits=world.areas.filter(a=>a.triangles.includes(id));const txt=hits.length?hits.map(a=>`${a.resolution}: ${a.name||'NULL'} · ${a.metadata||'NULL'}`).join(' | '):'NULL';meta.textContent=`TRI ${id} · ${txt}`}
function snapshotEditor(){return{name:nameInput.value,resolution:resolution.value,metadata:dataInput.value}}
function upsertContextArea(){if(!world.selected.length)return;const rec={triangles:[...world.selected],name:nameInput.value.trim(),resolution:resolution.value,metadata:dataInput.value.trim()};if(contextArea)Object.assign(contextArea,rec);else{contextArea=rec;world.areas.push(rec)}saveWorld();renderAll()}
function openMenu(x,y,id){contextFace=id;const isSel=selected(id);contextArea=isSel?areaForSelection():null;editPane.style.display=isSel?'block':'none';addPane.style.display=isSel?'none':'block';menuTitle.textContent=isSel?'EDIT SELECTED AREA':'UNSELECTED TRI '+id;if(isSel){nameInput.value=contextArea?.name||'';resolution.value=contextArea?.resolution||'GLOBAL';dataInput.value=contextArea?.metadata||'';contextOriginal=snapshotEditor()}else contextOriginal=null;menu.classList.add('open');const r=menu.getBoundingClientRect();menu.style.left=Math.max(6,Math.min(x,innerWidth-r.width-6))+'px';menu.style.top=Math.max(6,Math.min(y,innerHeight-r.height-6))+'px'}
function closeMenu(save=true){if(!menu.classList.contains('open'))return;if(save&&editPane.style.display!=='none')upsertContextArea();menu.classList.remove('open');contextFace=-1;contextArea=null;contextOriginal=null}
document.querySelector('#done').onclick=()=>closeMenu(true);document.querySelector('#editInvert').onclick=invert;document.querySelector('#menuInvert').onclick=invert;document.querySelector('#menuAdd').onclick=()=>{const id=contextFace;closeMenu(false);setSelected(id,true)};document.querySelector('#editCancel').onclick=()=>{if(contextOriginal){nameInput.value=contextOriginal.name;resolution.value=contextOriginal.resolution;dataInput.value=contextOriginal.metadata}closeMenu(false)};document.querySelector('#addCancel').onclick=()=>closeMenu(false);menu.onpointerdown=e=>e.stopPropagation();
function beginGesture(target,e,faceAt){closeMenu(true);const face=faceAt(e.clientX,e.clientY),g={id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,face,state:'pending',timer:null,lastFace:-1};target.setPointerCapture(e.pointerId);if(face>=0)g.timer=setTimeout(()=>{if(g.state==='pending'){g.state='long';openMenu(g.x,g.y,g.face)}},LONG);return g}
function moveDistance(g,e){return Math.hypot(e.clientX-g.x,e.clientY-g.y)}function cancelTimer(g){if(g?.timer){clearTimeout(g.timer);g.timer=null}}
let lastMapTap={t:0,x:0,y:0,face:-1},down=null;map.onpointerdown=e=>{down=beginGesture(map,e,mapFace)};map.onpointermove=e=>{if(!down||e.pointerId!==down.id||down.state==='long')return;if(down.state==='pending'&&moveDistance(down,e)>=DRAG){down.state='drag';cancelTimer(down);if(down.face>=0){setSelected(down.face,mode==='add');down.lastFace=down.face}}if(down.state==='drag'){const f=mapFace(e.clientX,e.clientY);if(f>=0&&f!==down.lastFace){down.lastFace=f;setSelected(f,mode==='add')}}};map.onpointerup=e=>{if(!down||e.pointerId!==down.id)return;cancelTimer(down);if(down.state==='pending'){const f=mapFace(e.clientX,e.clientY);if(f>=0){const now=performance.now(),dbl=lastMapTap.face===f&&now-lastMapTap.t<=DOUBLE&&Math.hypot(e.clientX-lastMapTap.x,e.clientY-lastMapTap.y)<=DOUBLE_DIST;inspect(f);if(dbl){toggleSelected(f);lastMapTap={t:0,x:0,y:0,face:-1}}else lastMapTap={t:now,x:e.clientX,y:e.clientY,face:f}}}down=null};map.onpointercancel=()=>{cancelTimer(down);down=null};
let lastGlobeTap={t:0,x:0,y:0,face:-1},gd=null;renderer.domElement.onpointerdown=e=>{targetQ=null;gd=beginGesture(renderer.domElement,e,globeFace)};renderer.domElement.onpointermove=e=>{if(!gd||e.pointerId!==gd.id||gd.state==='long')return;if(gd.state==='pending'&&moveDistance(gd,e)>=DRAG){gd.state='drag';cancelTimer(gd);targetQ=null}if(gd.state==='drag'){const dx=e.clientX-gd.lx,dy=e.clientY-gd.ly;group.rotation.y+=dx*.008;group.rotation.x=THREE.MathUtils.clamp(group.rotation.x+dy*.008,-Math.PI/2,Math.PI/2);group.rotation.z=0;gd.lx=e.clientX;gd.ly=e.clientY}};renderer.domElement.onpointerup=e=>{if(!gd||e.pointerId!==gd.id)return;cancelTimer(gd);if(gd.state==='pending'){const f=globeFace(e.clientX,e.clientY);if(f>=0){const now=performance.now(),dbl=lastGlobeTap.face===f&&now-lastGlobeTap.t<=DOUBLE&&Math.hypot(e.clientX-lastGlobeTap.x,e.clientY-lastGlobeTap.y)<=DOUBLE_DIST;inspect(f);if(dbl){toggleSelected(f);lastGlobeTap={t:0,x:0,y:0,face:-1}}else lastGlobeTap={t:now,x:e.clientX,y:e.clientY,face:f}}else{clearSelection();lastGlobeTap={t:0,x:0,y:0,face:-1}}}gd=null};renderer.domElement.onpointercancel=()=>{cancelTimer(gd);gd=null};
map.oncontextmenu=e=>e.preventDefault();renderer.domElement.oncontextmenu=e=>e.preventDefault();document.querySelector('#export').onclick=()=>{closeMenu(true);const blob=new Blob([JSON.stringify(world,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='worldbuilder.json';a.click();URL.revokeObjectURL(a.href)};
function resize(){const gp=document.querySelector('#globe').getBoundingClientRect();renderer.setSize(gp.width,gp.height,false);camera.aspect=gp.width/gp.height;camera.updateProjectionMatrix();const r=map.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);map.width=Math.round(r.width*d);map.height=Math.round(r.height*d);drawMap()}new ResizeObserver(resize).observe(document.querySelector('#app'));resize();renderAll();recenterSelection();(function loop(){requestAnimationFrame(loop);if(targetQ){group.quaternion.slerp(targetQ,.14);if(group.quaternion.angleTo(targetQ)<.002){group.quaternion.copy(targetQ);targetQ=null}}group.rotation.order='YXZ';group.rotation.x=THREE.MathUtils.clamp(group.rotation.x,-Math.PI/2,Math.PI/2);group.rotation.z=0;renderer.render(scene,camera)})();
</script></body></html>
