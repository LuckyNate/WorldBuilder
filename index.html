<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WorldBuilder</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#13242a;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}*{box-sizing:border-box}#app{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:grid;grid-template-rows:42% 58%;gap:1px;background:#3d4b49;overflow:hidden}.panel{position:relative;min-width:0;min-height:0;background:#17292f;overflow:hidden}.bar{position:absolute;z-index:5;left:8px;top:8px;padding:5px 8px;background:#0009;border-radius:6px;font-size:12px}.tools{position:absolute;z-index:6;right:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.tools button,.context button{border:1px solid #82908d;background:#263b40;color:#eee;border-radius:5px;padding:6px 8px}.tools button.on{background:#e3c96e;color:#241f12}.meta{position:absolute;z-index:7;left:8px;bottom:8px;max-width:calc(100% - 16px);padding:7px;background:#000b;border-radius:6px;font-size:11px;line-height:1.35}.context{position:fixed;z-index:30;display:none;min-width:210px;padding:9px;background:#101b1f;border:1px solid #82908d;border-radius:7px;box-shadow:0 4px 18px #0009}.context.open{display:block}.context input{width:100%;border:1px solid #82908d;background:#203238;color:#eee;border-radius:5px;padding:7px;margin-bottom:7px}.context button{width:100%;margin-top:5px}.context .title{font-size:11px;color:#9edfff;margin-bottom:7px}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:100%;max-height:100%;touch-action:none}#globe{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;touch-action:none}#globe canvas{position:absolute!important;inset:0;width:100%!important;height:100%!important;max-width:100%;max-height:100%}
</style>
</head>
<body>
<div id="app">
<section class="panel" id="mapPanel"><div class="bar" id="mapLabel">GLOBAL · drag to paint</div><div class="tools"><button id="add" class="on">ADD</button><button id="erase">ERASE</button><button id="invert">INVERT</button><button id="clear">CLEAR</button></div><canvas id="map"></canvas><div class="meta" id="meta">Continental: NULL · National: NULL · Regional: NULL · County: NULL · Village: NULL · District: NULL · Neighborhood: NULL</div></section>
<section class="panel"><div class="bar" id="globeLabel">GLOBAL</div><div id="globe"></div></section>
</div>
<div class="context" id="contextMenu"><div class="title" id="contextTitle"></div><div id="selectedMenu"><input id="placeName" type="text" placeholder="NULL" autocomplete="off"><button id="contextInvert">INVERT SELECTION</button><button id="selectedCancel">CANCEL</button></div><div id="unselectedMenu"><button id="contextAdd">ADD</button><button id="unselectedInvert">INVERT SELECTION</button><button id="unselectedCancel">CANCEL</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
const LEVELS=['GLOBAL','CONTINENTAL','NATIONAL','REGIONAL','COUNTY','VILLAGE','DISTRICT','NEIGHBORHOOD'];
const MAX_LOD=7,MIN_Z=1.55,MAX_Z=5.2,LONG_PRESS=520,DRAG_START=7;
const map=document.querySelector('#map'),globe=document.querySelector('#globe'),mapLabel=document.querySelector('#mapLabel'),globeLabel=document.querySelector('#globeLabel'),contextMenu=document.querySelector('#contextMenu'),contextTitle=document.querySelector('#contextTitle'),selectedMenu=document.querySelector('#selectedMenu'),unselectedMenu=document.querySelector('#unselectedMenu'),placeName=document.querySelector('#placeName');
let mode='add',lod=0,mesh,wire,hintWire,faces=[],targetQ=null,painting=false,lastPaint=-1,drag=0,last={x:0,y:0},mapDown=null,globeDown=null,longTimer=null,contextSnapshot=null,contextFace=-1,hintDirty=true;
const selectedLeaves=new Set(),places=[];
for(const id of ['add','erase'])document.querySelector('#'+id).onclick=()=>{mode=id;document.querySelector('#add').classList.toggle('on',id==='add');document.querySelector('#erase').classList.toggle('on',id==='erase')};
document.querySelector('#clear').onclick=()=>{selectedLeaves.clear();closeContext();refresh()};
function invertSelection(){const all=leafIds();for(const x of all)selectedLeaves.has(x)?selectedLeaves.delete(x):selectedLeaves.add(x);closeContext();refresh()}
document.querySelector('#invert').onclick=invertSelection;document.querySelector('#contextInvert').onclick=invertSelection;document.querySelector('#unselectedInvert').onclick=invertSelection;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x13242a);const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.z=MAX_Z;const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));globe.appendChild(renderer.domElement);renderer.domElement.style.touchAction='none';const group=new THREE.Group();group.rotation.order='YXZ';scene.add(group);scene.add(new THREE.HemisphereLight(0xf4ead8,0x27343a,1.7));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(3,2,5);scene.add(dl);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function geo(level){return new THREE.IcosahedronGeometry(1,level).toNonIndexed()}
function disposeHint(){if(!hintWire)return;group.remove(hintWire);hintWire.geometry.dispose();hintWire.material.dispose();hintWire=null}
function rebuild(n){lod=n;if(mesh){group.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();group.remove(wire);wire.geometry.dispose();wire.material.dispose();disposeHint()}const g=geo(lod),p=g.attributes.position,c=new Float32Array(p.count*3);g.setAttribute('color',new THREE.BufferAttribute(c,3));mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.85,side:THREE.FrontSide}));wire=new THREE.LineSegments(new THREE.EdgesGeometry(g,1),new THREE.LineBasicMaterial({color:0x344747,transparent:true,opacity:.65,depthTest:true,depthWrite:false}));group.add(mesh,wire);faces=[];for(let i=0;i<p.count;i+=3)faces.push([new THREE.Vector3().fromBufferAttribute(p,i),new THREE.Vector3().fromBufferAttribute(p,i+1),new THREE.Vector3().fromBufferAttribute(p,i+2)]);hintDirty=true;refresh()}
function leafIds(){const a=[],count=20*Math.pow(4,MAX_LOD);for(let i=0;i<count;i++)a.push(i);return a}
function spanForFace(i){const factor=Math.pow(4,MAX_LOD-lod);return[i*factor,(i+1)*factor]}
function full(i){const[a,b]=spanForFace(i);for(let x=a;x<b;x++)if(!selectedLeaves.has(x))return false;return true}
function setFace(i,on){const[a,b]=spanForFace(i);for(let x=a;x<b;x++)on?selectedLeaves.add(x):selectedLeaves.delete(x)}
function refresh(){if(!mesh)return;const col=mesh.geometry.attributes.color;for(let i=0;i<faces.length;i++){const yes=full(i),r=yes?.89:.72,g=yes?.79:.65,b=yes?.43:.52;for(let k=0;k<3;k++)col.setXYZ(i*3+k,r,g,b)}col.needsUpdate=true;mapLabel.textContent=LEVELS[lod]+' · drag to paint';globeLabel.textContent=LEVELS[lod];drawMap()}
function uv(v){const n=v.clone().normalize();return{u:(Math.atan2(n.z,n.x)+Math.PI)/(2*Math.PI),v:.5-Math.asin(n.y)/Math.PI}}
function copies(t){const p=t.map(uv),us=p.map(q=>q.u);if(Math.max(...us)-Math.min(...us)<=.5)return[p];return[p.map(q=>({u:q.u<.5?q.u+1:q.u,v:q.v})),p.map(q=>({u:q.u>.5?q.u-1:q.u,v:q.v}))]}
function drawMap(){const c=map.getContext('2d'),w=map.width,h=map.height;c.fillStyle='#27434c';c.fillRect(0,0,w,h);for(let i=0;i<faces.length;i++)for(const p of copies(faces[i])){c.beginPath();c.moveTo(p[0].u*w,p[0].v*h);c.lineTo(p[1].u*w,p[1].v*h);c.lineTo(p[2].u*w,p[2].v*h);c.closePath();c.fillStyle=full(i)?'#e3c96e':'#a99878';c.fill();c.strokeStyle='#304445';c.stroke()}}
function inside(x,y,a,b,c){const s=(p1,p2,p3)=>(p1.x-p3.x)*(p2.y-p3.y)-(p2.x-p3.x)*(p1.y-p3.y),p={x,y},d1=s(p,a,b),d2=s(p,b,c),d3=s(p,c,a);return!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0))}
function mapFace(x,y){const r=map.getBoundingClientRect(),u=(x-r.left)/r.width,v=(y-r.top)/r.height;for(let i=0;i<faces.length;i++)for(const p of copies(faces[i]))if(inside(u,v,{x:p[0].u,y:p[0].v},{x:p[1].u,y:p[1].v},{x:p[2].u,y:p[2].v}))return i;return-1}
function globeFace(x,y){const r=renderer.domElement.getBoundingClientRect();mouse.x=(x-r.left)/r.width*2-1;mouse.y=-(y-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const h=ray.intersectObject(mesh)[0];return h?h.faceIndex:-1}
function meanCenter(){const m=new THREE.Vector3();let n=0;for(let i=0;i<faces.length;i++)if(full(i)){m.add(faces[i][0].clone().add(faces[i][1]).add(faces[i][2]).normalize());n++}if(!n||m.lengthSq()<1e-9)return;m.normalize();const q=group.quaternion.clone(),world=m.clone().applyQuaternion(q),fix=new THREE.Quaternion().setFromUnitVectors(world,new THREE.Vector3(0,0,1));targetQ=fix.multiply(q);hintDirty=true}
function paintAt(x,y){const f=mapFace(x,y);if(f<0||f===lastPaint)return;lastPaint=f;setFace(f,mode==='add');refresh()}
function sameSelection(a,b){if(!a||a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true}
function currentPlaceName(snapshot){const p=places.find(p=>sameSelection(p.leaves,snapshot));return p?p.name:''}
function storePlaceName(){if(!contextSnapshot)return;const name=placeName.value.trim();const p=places.find(p=>sameSelection(p.leaves,contextSnapshot));if(p)p.name=name;else places.push({leaves:new Set(contextSnapshot),name})}
function openContext(x,y,face){if(face<0)return;contextFace=face;const selected=full(face);contextSnapshot=selected?new Set(selectedLeaves):null;selectedMenu.style.display=selected?'block':'none';unselectedMenu.style.display=selected?'none':'block';contextTitle.textContent=selected?'EDIT '+LEVELS[lod]+' METADATA':'UNSELECTED '+LEVELS[lod];if(selected)placeName.value=currentPlaceName(contextSnapshot);contextMenu.classList.add('open');const mw=contextMenu.offsetWidth||210,mh=contextMenu.offsetHeight||120;contextMenu.style.left=Math.max(6,Math.min(x,innerWidth-mw-6))+'px';contextMenu.style.top=Math.max(6,Math.min(y,innerHeight-mh-6))+'px';if(selected)placeName.focus()}
function closeContext(save=true){if(save&&contextMenu.classList.contains('open')&&contextSnapshot)storePlaceName();contextMenu.classList.remove('open');contextSnapshot=null;contextFace=-1}
contextMenu.onpointerdown=e=>e.stopPropagation();placeName.onchange=storePlaceName;placeName.onkeydown=e=>{if(e.key==='Enter'){storePlaceName();placeName.blur()}};document.querySelector('#selectedCancel').onclick=()=>closeContext(false);document.querySelector('#unselectedCancel').onclick=()=>closeContext(false);document.querySelector('#contextAdd').onclick=()=>{if(contextFace>=0)setFace(contextFace,true);closeContext(false);refresh();meanCenter()};
map.onpointerdown=e=>{closeContext();mapDown={id:e.pointerId,x:e.clientX,y:e.clientY,face:mapFace(e.clientX,e.clientY),dragged:false};painting=false;lastPaint=-1;map.setPointerCapture(e.pointerId);if(mapDown.face>=0)longTimer=setTimeout(()=>{if(mapDown&&!mapDown.dragged){openContext(mapDown.x,mapDown.y,mapDown.face);mapDown=null}},LONG_PRESS)};
map.onpointermove=e=>{if(!mapDown||e.pointerId!==mapDown.id)return;const d=Math.hypot(e.clientX-mapDown.x,e.clientY-mapDown.y);if(!mapDown.dragged&&d>=DRAG_START){mapDown.dragged=true;clearTimeout(longTimer);longTimer=null;painting=true;paintAt(mapDown.x,mapDown.y)}if(painting)paintAt(e.clientX,e.clientY)};
function finishMapPointer(){clearTimeout(longTimer);longTimer=null;if(painting)meanCenter();painting=false;lastPaint=-1;mapDown=null}map.onpointerup=finishMapPointer;map.onpointercancel=finishMapPointer;
function midpoint(a,b){return a.clone().add(b).normalize().multiplyScalar(1.0025)}
function rebuildHint(){hintDirty=false;disposeHint();if(lod>=MAX_LOD)return;const pos=[],front=new THREE.Vector3(0,0,1),q=group.quaternion;for(const t of faces){const center=t[0].clone().add(t[1]).add(t[2]).normalize().applyQuaternion(q);if(center.dot(front)<=0)continue;const ab=midpoint(t[0],t[1]),bc=midpoint(t[1],t[2]),ca=midpoint(t[2],t[0]);for(const[a,b]of[[ab,bc],[bc,ca],[ca,ab]])pos.push(a.x,a.y,a.z,b.x,b.y,b.z)}if(!pos.length)return;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));hintWire=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xd9f4ff,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthTest:true,depthWrite:false}));group.add(hintWire)}
renderer.domElement.onpointerdown=e=>{closeContext();last={x:e.clientX,y:e.clientY};drag=0;globeDown={id:e.pointerId,x:e.clientX,y:e.clientY,face:globeFace(e.clientX,e.clientY),dragged:false};renderer.domElement.setPointerCapture(e.pointerId);if(globeDown.face>=0)longTimer=setTimeout(()=>{if(globeDown&&!globeDown.dragged){openContext(globeDown.x,globeDown.y,globeDown.face);globeDown=null}},LONG_PRESS)};
renderer.domElement.onpointermove=e=>{if(!globeDown||e.pointerId!==globeDown.id)return;const total=Math.hypot(e.clientX-globeDown.x,e.clientY-globeDown.y);if(total>=DRAG_START){globeDown.dragged=true;clearTimeout(longTimer);longTimer=null}if(!globeDown.dragged)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;drag+=Math.abs(dx)+Math.abs(dy);targetQ=null;group.rotation.y+=dx*.008;group.rotation.x=THREE.MathUtils.clamp(group.rotation.x+dy*.008,-Math.PI/2,Math.PI/2);group.rotation.z=0;hintDirty=true;last={x:e.clientX,y:e.clientY}};
function finishGlobePointer(){clearTimeout(longTimer);longTimer=null;globeDown=null}renderer.domElement.onpointerup=finishGlobePointer;renderer.domElement.onpointercancel=finishGlobePointer;
renderer.domElement.onwheel=e=>{e.preventDefault();camera.position.z=THREE.MathUtils.clamp(camera.position.z*Math.exp(e.deltaY*.0012),MIN_Z,MAX_Z);syncLOD();hintDirty=true};
function syncLOD(){const t=(MAX_Z-camera.position.z)/(MAX_Z-MIN_Z),n=Math.max(0,Math.min(MAX_LOD,Math.floor(t*(MAX_LOD+1))));if(n!==lod)rebuild(n)}
function enforceNorthUp(){group.rotation.order='YXZ';group.rotation.x=THREE.MathUtils.clamp(group.rotation.x,-Math.PI/2,Math.PI/2);group.rotation.z=0}
function resize(){const r=globe.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();const m=map.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);map.width=m.width*d;map.height=m.height*d;drawMap();hintDirty=true}new ResizeObserver(resize).observe(document.querySelector('#app'));rebuild(0);resize();(function loop(){requestAnimationFrame(loop);if(targetQ){group.quaternion.slerp(targetQ,.14);hintDirty=true}enforceNorthUp();if(hintDirty)rebuildHint();renderer.render(scene,camera)})();
</script>
</body>
</html>
